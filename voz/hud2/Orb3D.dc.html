<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"nucleo","options":["nucleo","liquido","giro"],"section":"Bolinha"},"state":{"editor":"enum","default":"idle","options":["idle","listening","transcribing","thinking","speaking","writing","error","offline"],"section":"Bolinha"},"px":{"editor":null},"arcs":{"editor":null},"nowF":{"editor":null},"level":{"editor":null},"paused":{"editor":null},"muted":{"editor":null},"pulse":{"editor":null},"intro":{"editor":null},"$preview":{"width":400,"height":400}}'>
const STATES = ['idle', 'listening', 'transcribing', 'thinking', 'speaking', 'writing', 'working', 'error', 'offline'];  // working: usando um conector, uma skill ou um agente, ou com um pedido em segundo plano
function nz(i, t) { return (0.5 + 0.5 * Math.sin(t * 3.1 + i * 1.7)) * (0.5 + 0.5 * Math.sin(t * 5.3 + i * 0.9 + 1.3)); }
function mixc(a, b, w) { return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w, a[2] + (b[2] - a[2]) * w]; }
const TAU = Math.PI * 2;
const DEMO_ARCS = [
  { a: 0.0, b: 0.06, k: 'miss' }, { a: 0.06, b: 0.12, k: 'done' }, { a: 0.12, b: 0.19, k: 'done' }, { a: 0.19, b: 0.38, k: 'now' },
  { a: 0.38, b: 0.44, k: 'next' }, { a: 0.44, b: 0.56, k: 'next' }, { a: 0.62, b: 0.7, k: 'fixed' }, { a: 0.74, b: 0.82, k: 'next' }, { a: 0.86, b: 0.92, k: 'next' }
];
const KIND = { done: 1, now: 2, next: 3, fixed: 4, miss: 5 };

const VS = 'attribute vec2 aP; varying vec2 vUv; void main(){ vUv = aP; gl_Position = vec4(aP, 0.0, 1.0); }';

const FS_COMMON = `
precision highp float;
varying vec2 vUv;
uniform float uT, uE, uPh, uNow, uNA;
uniform vec4 uW;   // idle, ouvindo, pensando, falando
uniform vec3 uW2;  // erro, offline, transcrevendo
uniform vec2 uL;   // ponteiro
uniform vec3 uArcs[12];

float hash(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x){
  vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * noise(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; } return s; }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

vec3 keyDir(){ return normalize(vec3(-0.55 + uL.x * 0.45, 0.62 - uL.y * 0.4, 0.62)); }
vec3 tintState(vec3 c){
  vec3 e = vec3(c.r * 1.05, c.g * 0.42, c.b * 0.32);
  vec3 g = vec3(dot(c, vec3(0.33)) * 0.55);
  return mix(mix(c, e, uW2.x), g, uW2.y);
}
// estúdio: caixa de luz quente no alto, filete à direita, luz de contorno atrás, rebatida do chão
vec3 env(vec3 d){
  vec3 c = vec3(0.010, 0.009, 0.008);
  vec3 k = keyDir();
  float kk = dot(d, k);
  c += vec3(1.0, 0.86, 0.62) * smoothstep(0.88, 0.975, kk) * 2.4;
  c += vec3(0.9, 0.66, 0.32) * pow(max(kk, 0.0), 5.0) * 0.32;
  c += vec3(1.0, 0.8, 0.5) * smoothstep(0.93, 0.985, dot(d, normalize(vec3(0.75, 0.42, 0.45)))) * 0.7;
  float strip = smoothstep(0.07, 0.0, abs(d.x - 0.72)) * smoothstep(-0.7, 0.1, d.y) * smoothstep(0.9, 0.3, d.y) * step(d.z, 0.3);
  c += vec3(0.95, 0.7, 0.36) * strip * 0.9;
  c += vec3(0.75, 0.52, 0.24) * smoothstep(-0.1, -0.95, d.z) * 0.32;
  c += vec3(0.32, 0.2, 0.08) * smoothstep(0.05, -0.8, d.y) * 0.35;
  c += vec3(0.3, 0.2, 0.08) * exp(-abs(d.y + 0.05) * 16.0) * 0.22;
  return c;
}
vec3 envSoft(vec3 d){ return env(d) * 0.55 + env(normalize(d + vec3(0.0, 0.25, 0.0))) * 0.25 + env(normalize(d + vec3(0.22, -0.1, 0.0))) * 0.2; }
vec3 finish(vec3 c){ c = c * (1.0 + c / 9.0) / (1.0 + c); return pow(c, vec3(0.4545)); }
`;

// 1 · Núcleo: cristal com energia por dentro
const FS_NUCLEO = `
void main(){
  vec2 uv = vUv;
  vec3 ro = vec3(0.0, 0.0, 3.4), rd = normalize(vec3(uv * 0.44, -1.0));
  float R = 0.82 + 0.012 * sin(uT * 0.9) * uW.x + 0.03 * uE * uW.w;
  vec3 core = tintState(vec3(1.0, 0.5, 0.13));
  float gI = (0.62 + 0.75 * uE * (uW.w + 0.6 * uW.y) + 0.2 * uW.z) * (1.0 - 0.75 * uW2.y);
  float b = dot(ro, rd), c = dot(ro, ro) - R * R, h = b * b - c;
  float dmin = length(ro + rd * (-b));
  if (h < 0.0) {
    float g = exp(-(dmin - R) * 7.0) * 0.5 * gI + exp(-(dmin - R) * 2.2) * 0.14 * gI;
    gl_FragColor = vec4(vec3(1.0, 0.72, 0.36) * core.r * g * 1.1 * smoothstep(1.0, 0.7, length(uv)), 0.0);
    return;
  }
  h = sqrt(h);
  vec3 p = ro + rd * (-b - h), n = normalize(p);
  float ndv = max(dot(-rd, n), 0.0);
  float fres = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);
  vec3 refl = env(reflect(rd, n));
  vec3 rdi = refract(rd, n, 1.0 / 1.45);
  float bi = dot(p, rdi), ci = dot(p, p) - R * R, tex = -bi + sqrt(max(bi * bi - ci, 0.0));
  vec3 acc = vec3(0.0);
  float dt = tex / 26.0;
  float coreR = 0.13 + 0.09 * uE * (uW.y + uW.w) + 0.02 * sin(uT * 1.3) * uW.x + 0.04 * uW.z;
  for (int i = 0; i < 26; i++) {
    vec3 q = p + rdi * (float(i) + 0.5) * dt;
    float r = length(q);
    vec3 qq = q; qq.xz = rot(uPh) * qq.xz; qq.xy = rot(uPh * 0.6) * qq.xy;
    float n1 = fbm(qq * 3.4 + vec3(0.0, uT * 0.3, 0.0));
    float dens = smoothstep(coreR + 0.22, coreR - 0.08, r + (n1 - 0.5) * 0.42);
    float shellR = 0.5 + 0.05 * sin(uT * 0.7) + 0.08 * uE * uW.w;
    float shell = exp(-abs(r - shellR) * 60.0) * smoothstep(0.5, 0.72, n1) * (0.3 + 1.4 * uW.z + 0.8 * uE + 0.5 * uW2.z);
    float rn = 1.0 - abs(noise(qq * 4.2 + vec3(uT * 0.5, 0.0, uT * 0.3)) * 2.0 - 1.0);
    float tendril = pow(rn, 12.0) * smoothstep(0.5, 0.08, r) * (0.35 + 1.3 * uW.z + 1.1 * uE + 0.6 * uW2.z);
    acc += core * (dens * dens * dens * 3.4 + shell * 1.6 + tendril * 5.0) * dt * 1.5;
    acc += vec3(1.0, 0.86, 0.6) * smoothstep(0.08, 0.0, r) * dt * 9.0 * (0.55 + uE);
  }
  acc *= gI * 1.25;
  vec3 pe = p + rdi * tex;
  vec3 through = env(refract(rdi, -normalize(pe), 1.45)) * 0.14;
  vec3 col = mix(acc + through, refl, fres) + refl * 0.03;
  vec3 hv = normalize(keyDir() - rd);
  col += vec3(1.0, 0.94, 0.82) * pow(max(dot(n, hv), 0.0), 260.0) * 3.2;
  col += core * pow(1.0 - ndv, 3.0) * 0.22 * gI;
  col += core * smoothstep(0.55, 1.0, dot(n, normalize(vec3(0.45, -0.6, 0.4)))) * 0.18 * gI;
  gl_FragColor = vec4(finish(col), 1.0);
}
`;

// 2 · Ouro líquido: metal que se deforma com a voz
const FS_LIQUIDO = `
float disp(vec3 p){
  float t = uT;
  float idle = 0.022 * sin(3.0 * p.x + t * 0.8) * sin(3.0 * p.y + t * 0.7) * sin(3.0 * p.z + t * 0.6);
  float lis = 0.11 * uE * (noise(p * 2.4 + vec3(0.0, t * 1.4, 0.0)) - 0.5) * 2.0;
  float tra = 0.03 * sin(7.0 * p.y - t * 4.0);
  vec3 pr = p; pr.xy = rot(uPh) * pr.xy;
  float thk = 0.07 * sin(3.0 * atan(pr.y, pr.x)) * (1.0 - abs(normalize(p).z));
  vec3 sp = normalize(p);
  float spk = 0.05 * (0.2 + uE) * sin(9.0 * sp.y + t * 6.0) * sin(5.0 * atan(sp.z, sp.x) + t * 2.5) + pow(max(0.0, noise(sp * 4.0 + vec3(t * 0.7, 0.0, t * 0.4)) - 0.45), 1.5) * 0.3 * uE + 0.03 * uE;
  float err = 0.035 * sin(9.0 * p.x + t * 2.0) * sin(9.0 * p.y - t * 1.7);
  return idle * uW.x + lis * uW.y + thk * uW.z + spk * uW.w + err * uW2.x + tra * uW2.z;
}
float map(vec3 p){ return length(p) - 0.8 - 0.01 * sin(uT * 0.9) * uW.x - disp(p); }
vec3 nrm(vec3 p){ vec2 e = vec2(0.0025, -0.0025); return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx)); }
void main(){
  vec2 uv = vUv;
  vec3 ro = vec3(0.0, 0.0, 3.4), rd = normalize(vec3(uv * 0.44, -1.0));
  vec3 gold = tintState(vec3(1.0, 0.77, 0.36));
  float t = 2.1, md = 9.0; bool hit = false;
  for (int i = 0; i < 72; i++) {
    vec3 p = ro + rd * t; float d = map(p);
    md = min(md, d);
    if (d < 0.0015) { hit = true; break; }
    t += d * 0.7;
    if (t > 4.8) break;
  }
  float gI = (0.5 + 0.6 * uE * (uW.w + 0.5 * uW.y)) * (1.0 - 0.7 * uW2.y);
  if (!hit) {
    float dm = max(length(ro + rd * (-dot(ro, rd))) - 0.8, 0.0);
    float g = exp(-dm * 9.0) * 0.32 * gI + exp(-dm * 2.6) * 0.08 * gI;
    gl_FragColor = vec4(vec3(1.0, 0.76, 0.42) * gold.r * g * 1.1 * smoothstep(1.0, 0.7, length(uv)), 0.0);
    return;
  }
  vec3 p = ro + rd * t, n = nrm(p);
  float ndv = max(dot(-rd, n), 0.0);
  vec3 F = gold + (vec3(1.0) - gold) * pow(1.0 - ndv, 5.0);
  vec3 r = reflect(rd, n);
  vec3 col = mix(env(r), envSoft(r), 0.35) * F * 1.15;
  float cav = smoothstep(-0.04, 0.05, disp(p));
  col *= 0.7 + 0.3 * cav;
  vec3 hv = normalize(keyDir() - rd);
  col += vec3(1.0, 0.92, 0.78) * pow(max(dot(n, hv), 0.0), 180.0) * 2.4;
  col += gold * 0.012;
  gl_FragColor = vec4(finish(col), 1.0);
}
`;

// 3 · Giroscópio: pérola de obsidiana, anéis de ouro girando e o anel do dia em 3D
const FS_GIRO = `
const float TILT = 0.22;
float sdTorus(vec3 p, float R, float r){ vec2 q = vec2(length(p.xz) - R, p.y); return length(q) - r; }
vec3 ring1(vec3 p){ p.yz = rot(uPh * 1.0 + 0.6) * p.yz; p.xy = rot(uPh * 0.55) * p.xy; return p; }
vec3 ring2(vec3 p){ p.xy = rot(-uPh * 0.8 + 1.2) * p.xy; p.yz = rot(uPh * 0.45 + 2.0) * p.yz; return p; }
vec3 dayP(vec3 p){ p.yz = rot(-TILT) * p.yz; return vec3(p.x, p.z, -p.y); }
float coreR(){ return 0.46 + 0.012 * sin(uT * 0.9) * uW.x + 0.025 * uE * uW.w; }
vec2 map(vec3 p){
  float s = 1.0 + 0.05 * uE * uW.w;
  vec2 m = vec2(length(p) - coreR(), 1.0);
  float a = sdTorus(ring1(p), 0.66 * s, 0.026);
  if (a < m.x) m = vec2(a, 2.0);
  float b = sdTorus(ring2(p), 0.79 * s, 0.022);
  if (b < m.x) m = vec2(b, 2.0);
  vec3 q = dayP(p);
  float c = sdTorus(q, 1.02, 0.034);
  if (c < m.x) m = vec2(c, 3.0);
  float ang = (108.0 + 324.0 * uNow) * 0.01745329;
  vec3 bp = vec3(cos(ang) * 1.02, 0.0, sin(ang) * 1.02);
  float bead = length(q - bp) - 0.055;
  if (bead < m.x) m = vec2(bead, 4.0);
  return m;
}
vec3 nrm(vec3 p){ vec2 e = vec2(0.0015, -0.0015); return normalize(e.xyy * map(p + e.xyy).x + e.yyx * map(p + e.yyx).x + e.yxy * map(p + e.yxy).x + e.xxx * map(p + e.xxx).x); }
vec3 arcCol(float f){
  vec3 c = vec3(0.0);
  for (int i = 0; i < 12; i++) {
    if (float(i) >= uNA) break;
    vec3 a = uArcs[i];
    if (f >= a.x && f <= a.y) {
      float k = a.z;
      if (k < 1.5) c = vec3(0.2, 0.12, 0.03) * 1.2;
      else if (k < 2.5) c = (f <= uNow) ? vec3(1.0, 0.62, 0.18) * 2.4 : vec3(0.8, 0.5, 0.13) * 0.7;
      else if (k < 3.5) c = vec3(0.45, 0.25, 0.05) * 0.8;
      else if (k < 4.5) c = vec3(0.95, 0.92, 0.86) * 0.35 * step(0.5, fract(f * 70.0));
      else c = vec3(0.65, 0.12, 0.04) * 1.6;
    }
  }
  return c;
}
void main(){
  vec2 uv = vUv;
  vec3 ro = vec3(0.0, 0.0, 3.4), rd = normalize(vec3(uv * 0.44, -1.0));
  vec3 core = tintState(vec3(1.0, 0.5, 0.13));
  vec3 gold = tintState(vec3(1.0, 0.77, 0.36));
  float t = 1.9, md = 9.0; vec2 h = vec2(9.0, 0.0); bool hit = false;
  for (int i = 0; i < 140; i++) {
    vec3 p = ro + rd * t; h = map(p);
    if (h.y < 1.5) md = min(md, h.x);
    if (h.x < 0.001) { hit = true; break; }
    t += h.x * 0.9;
    if (t > 5.0) break;
  }
  float gI = (0.6 + 0.75 * uE * (uW.w + 0.6 * uW.y) + 0.25 * uW.z) * (1.0 - 0.75 * uW2.y);
  if (!hit) {
    float dm = max(length(ro + rd * (-dot(ro, rd))) - coreR(), 0.0);
    float g = exp(-dm * 6.0) * 0.4 * gI + exp(-dm * 1.8) * 0.1 * gI;
    gl_FragColor = vec4(vec3(1.0, 0.72, 0.36) * core.r * g * 1.1 * smoothstep(1.0, 0.7, length(uv)), 0.0);
    return;
  }
  vec3 p = ro + rd * t, n = nrm(p);
  float ndv = max(dot(-rd, n), 0.0);
  vec3 r = reflect(rd, n);
  vec3 hv = normalize(keyDir() - rd);
  float spec = pow(max(dot(n, hv), 0.0), 200.0);
  float ao = clamp(map(p + n * 0.08).x / 0.08, 0.0, 1.0);
  vec3 col;
  if (h.y < 1.5) {
    float fres = 0.05 + 0.95 * pow(1.0 - ndv, 5.0);
    float inner = pow(ndv, 2.2);
    float sw = fbm(vec3(p.xy * 3.0, uT * 0.25 + uPh * 0.3));
    col = vec3(0.004) + core * inner * smoothstep(0.35, 0.75, sw) * gI * 0.35 + core * pow(ndv, 14.0) * 0.55 * gI;
    col = mix(col, env(r) * 1.1, fres) + env(r) * 0.06;
    col += vec3(1.0, 0.95, 0.85) * spec * 3.0;
  } else if (h.y < 2.5) {
    vec3 F = gold + (vec3(1.0) - gold) * pow(1.0 - ndv, 5.0);
    col = mix(env(r), envSoft(r), 0.5) * F * 1.2 * (0.55 + 0.45 * ao);
    col += vec3(1.0, 0.9, 0.75) * spec * 1.6;
    col += core * 0.05 * gI;
  } else if (h.y < 3.5) {
    vec3 q = dayP(p);
    float th = -atan(-q.z, q.x) * 57.29578;
    float f = mod(th - 108.0, 360.0) / 324.0;
    vec3 bronze = tintState(vec3(0.3, 0.18, 0.06));
    vec3 F = bronze + (vec3(1.0) - bronze) * pow(1.0 - ndv, 5.0);
    col = envSoft(r) * F * 0.9 * (0.6 + 0.4 * ao);
    if (f <= 1.0) col += arcCol(f) * (0.55 + 0.45 * ndv);
    col += vec3(1.0, 0.9, 0.75) * spec * 1.2;
  } else {
    col = vec3(1.0, 0.97, 0.9) * 1.8 + vec3(1.0) * spec;
  }
  gl_FragColor = vec4(finish(col), 1.0);
}
`;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {};
    this.cv = null; this.ov = null; this.gl = null; this.prog = null; this.raf = 0; this.last = 0; this.t = 0; this.ph = 0.8;
    this.w = {}; STATES.forEach((s) => { this.w[s] = s === 'idle' ? 1 : 0; });
    this.lv = 0; this.energy = 0; this.nextAuto = 0; this.vis = true; this.variant = '';
    this.key = 0; this.nextKey = 0; this.pen = -Math.PI / 2; this.lastPulse = props.pulse; this.ink = [];
    this.tx = 0; this.ty = 0; this.gx = 0; this.gy = 0; this.failed = false;
    this.onPM = (e) => {
      if (!this.cv) return;
      const r = this.cv.getBoundingClientRect();
      if (!r.width) return;
      this.gx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / 600));
      this.gy = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / 500));
    };
    this.setCanvas = (el) => { if (el !== this.cv) { this.cv = el; this.gl = null; this.prog = null; } };
    this.setOver = (el) => { this.ov = el; };
    this.loop = (ts) => { this.raf = requestAnimationFrame(this.loop); this.tick(ts); };
  }

  componentDidMount() {
    try { this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { this.reduce = false; }
    try { window.addEventListener('pointermove', this.onPM, { passive: true }); } catch (e) { /* sem ponteiro */ }
    try {
      this.io = new IntersectionObserver((en) => { this.vis = en[0] ? en[0].isIntersecting : true; });
      if (this.cv) this.io.observe(this.cv);
    } catch (e) { this.io = null; }
    this.raf = requestAnimationFrame(this.loop);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf); this.raf = 0;
    try { window.removeEventListener('pointermove', this.onPM); } catch (e) { /* ok */ }
    if (this.io) this.io.disconnect();
  }

  setup() {
    const p = this.props, cv = this.cv;
    if (!cv) return false;
    const gl = this.gl || cv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
    if (!gl) { this.failed = true; return false; }
    this.gl = gl;
    const v = p.variant || 'nucleo';
    const body = v === 'liquido' ? FS_LIQUIDO : v === 'giro' ? FS_GIRO : FS_NUCLEO;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn('shader', gl.getShaderInfoLog(s)); return null; } return s; };
    const vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FS_COMMON + body);
    if (!vs || !fs) { this.failed = true; return false; }
    const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.warn('link', gl.getProgramInfoLog(pr)); this.failed = true; return false; }
    gl.useProgram(pr);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'aP'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = {}; ['uT', 'uE', 'uPh', 'uNow', 'uNA', 'uW', 'uW2', 'uL', 'uArcs'].forEach((n) => { U[n] = gl.getUniformLocation(pr, n); });
    this.U = U; this.prog = pr; this.variant = v;
    return true;
  }

  tick(ts) {
    const p = this.props;
    const dt = Math.min(0.05, Math.max(0.001, (ts - (this.last || ts)) / 1000));
    this.last = ts;
    if (!this.cv) return;
    if (p.paused || !this.vis || document.hidden) return;
    if (!this.prog || this.variant !== (p.variant || 'nucleo')) { this.prog = null; if (this.failed || !this.setup()) { this.drawFallback(); return; } }
    this.t += dt * (this.reduce ? 0.35 : 1);
    const t = this.t;
    let target = STATES.indexOf(p.state) >= 0 ? p.state : 'idle';
    if (target === 'speaking' && p.muted) target = 'writing';
    const k = Math.min(1, dt * 6);
    // abertura: o núcleo acende
    let inP = 1;
    if (p.intro) inP = Math.max(0, Math.min(1, (Date.now() - p.intro) / 1900));
    if (this.inP !== inP) {
      this.inP = inP;
      const e = 1 - Math.pow(1 - inP, 3);
      const st = 'opacity:' + e.toFixed(3) + ';transform:scale(' + (0.86 + 0.14 * e).toFixed(4) + ')';
      if (this.cv) this.cv.style.cssText = this.cv.style.cssText.replace(/opacity:[^;]*;?|transform:[^;]*;?/g, '') + ';' + st;
      if (this.ov) this.ov.style.cssText = this.ov.style.cssText.replace(/opacity:[^;]*;?|transform:[^;]*;?/g, '') + ';' + st;
    }
    if (typeof p.pulse === 'number' && p.pulse !== this.lastPulse) { this.lastPulse = p.pulse; this.energy = Math.min(1, this.energy + 0.6); }
    STATES.forEach((s) => { this.w[s] += ((s === target ? 1 : 0) - this.w[s]) * k; });
    const gn = window.GD_NIVEL, vivo = !!(gn && gn.vivo);  // volume real, quando o guardião de verdade está ligado
    const nivel = typeof p.level === 'number' && p.level >= 0 ? p.level : (vivo ? (target === 'listening' ? gn.mic : target === 'speaking' ? gn.voz : 0) : -1);
    const ext = nivel >= 0;
    let lvT = 0;
    if (target === 'listening') lvT = ext ? Math.min(1, nivel * 1.6) : 0.45 + 0.35 * Math.sin(t * 2.3) * Math.sin(t * 0.9 + 1);
    this.lv += (lvT - this.lv) * Math.min(1, dt * 12);
    if (target === 'speaking') {
      if (ext) this.energy = Math.max(this.energy, Math.min(1, nivel * 1.25));
      else if (t > this.nextAuto) { this.energy = Math.min(1, this.energy + 0.5 + Math.random() * 0.3); this.nextAuto = t + 0.14 + Math.random() * 0.16; }
    }
    // escrevendo: cada "tecla" é um pulso curto; a caneta anda pela borda
    if (target === 'writing' || target === 'transcribing') {
      if (t > this.nextKey) { this.key = Math.min(1, this.key + 0.55 + Math.random() * 0.35); this.nextKey = t + 0.06 + Math.random() * (Math.random() < 0.12 ? 0.45 : 0.1); }
    }
    this.key *= Math.exp(-dt * 9);
    this.pen += dt * (0.55 + 0.9 * this.key) * (this.w.writing + this.w.transcribing);
    this.energy *= Math.exp(-dt * 3.6);
    const E = Math.max(this.lv * this.w.listening, this.energy * this.w.speaking, this.lv, this.key * 0.45 * this.w.writing);
    this.ph += dt * (0.22 + 1.5 * this.w.thinking + 0.8 * this.w.working + 0.5 * E) * (this.reduce ? 0.3 : 1);
    this.tx += (this.gx - this.tx) * Math.min(1, dt * 2.5); this.ty += (this.gy - this.ty) * Math.min(1, dt * 2.5);
    const sw = this.reduce ? 0 : 1;
    const lx = this.tx + 0.25 * Math.sin(t * 0.33) * sw, ly = this.ty + 0.2 * Math.cos(t * 0.27) * sw;

    const px = p.px || 400;
    const dpr = Math.min(1.5, window.devicePixelRatio || 1);
    const bs = Math.round(px * dpr);
    const cv = this.cv, gl = this.gl;
    if (cv.width !== bs || cv.height !== bs) { cv.width = bs; cv.height = bs; }
    gl.viewport(0, 0, bs, bs);
    const U = this.U, W = this.w;
    gl.uniform1f(U.uT, t); gl.uniform1f(U.uE, E); gl.uniform1f(U.uPh, this.ph);
    gl.uniform4f(U.uW, W.idle + 0.5 * W.working, W.listening, W.thinking + 0.5 * W.working, W.speaking + 0.6 * W.writing);
    gl.uniform3f(U.uW2, W.error, W.offline, W.transcribing);
    gl.uniform2f(U.uL, lx, ly);
    const arcs = p.arcs && p.arcs.length ? p.arcs : DEMO_ARCS;
    const nowF = typeof p.nowF === 'number' ? p.nowF : 0.27;
    const flat = new Float32Array(36);
    const na = Math.min(12, arcs.length);
    for (let i = 0; i < na; i++) { flat[i * 3] = arcs[i].a; flat[i * 3 + 1] = arcs[i].b; flat[i * 3 + 2] = KIND[arcs[i].k] || 3; }
    gl.uniform3fv(U.uArcs, flat); gl.uniform1f(U.uNA, na); gl.uniform1f(U.uNow, nowF);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    this.drawOver(px, arcs, nowF, E, t, dt);
  }

  // fio do dia, só na proposta Ouro líquido
  drawOver(px, arcs, nowF, E, t, dt) {
    const ov = this.ov, p = this.props;
    if (!ov) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1), bs = Math.round(px * dpr);
    if (ov.width !== bs || ov.height !== bs) { ov.width = bs; ov.height = bs; }
    const ctx = ov.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, px, px);
    if ((p.variant || 'nucleo') === 'nucleo') { this.drawWave(ctx, px, t, dt, E); return; }
    if ((p.variant || 'nucleo') !== 'liquido' || px < 120) return;
    const R = px / 2 * 0.9, c = px / 2, ang = (f) => (108 + 324 * f) * Math.PI / 180;
    const off = this.w.offline;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(c, c, R, ang(0), ang(1)); ctx.strokeStyle = 'rgba(178,132,49,' + (0.16 * (1 - off * 0.6)) + ')'; ctx.lineWidth = 1; ctx.stroke();
    const col = { done: [111, 83, 34, 0.9], now: [227, 185, 100, 0.95], next: [178, 132, 49, 0.55], fixed: [243, 236, 220, 0.3], miss: [210, 96, 58, 0.85] };
    arcs.forEach((a) => {
      const k = col[a.k] || col.next;
      ctx.beginPath(); ctx.arc(c, c, R, ang(a.a) + 0.012, ang(a.b) - 0.012);
      ctx.strokeStyle = 'rgba(' + k[0] + ',' + k[1] + ',' + k[2] + ',' + (k[3] * (1 - off * 0.6)) + ')'; ctx.lineWidth = a.k === 'now' ? 2.4 : 1.6; ctx.stroke();
    });
    const an = ang(nowF), bx = c + Math.cos(an) * R, by = c + Math.sin(an) * R;
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, 10);
    g.addColorStop(0, 'rgba(255,240,205,.9)'); g.addColorStop(1, 'rgba(227,185,100,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, 10, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f3ecdc'; ctx.beginPath(); ctx.arc(bx, by, 3, 0, TAU); ctx.fill();
  }

  // onda em volta do Núcleo: a sua voz (marfim), a voz dele (ouro) e a escrita (pulso que corre pela borda)
  drawWave(ctx, px, t, dt, E) {
    const W = this.w, c = px / 2, r0 = px * 0.338, A = px * 0.095;
    const wl = W.listening, ws = W.speaking, ww = W.writing, wt = W.transcribing, wth = W.thinking, wi = W.idle + 0.6 * W.working, we = W.error, wo = W.offline, wk = W.working;
    const lv = this.lv, en = this.energy * ws, key = this.key;
    const N = px < 160 ? 120 : 360;
    const ivory = [246, 238, 220], gold = [236, 190, 104], brasa = [226, 112, 70], grey = [140, 134, 120];
    let col = mixc(gold, ivory, (wl + wt) / Math.max(0.001, wl + wt + ws + ww + wth + wi));
    col = mixc(col, brasa, we); col = mixc(col, grey, wo);
    const rgb = (a) => 'rgba(' + (col[0] | 0) + ',' + (col[1] | 0) + ',' + (col[2] | 0) + ',' + Math.max(0, Math.min(1, a)).toFixed(3) + ')';
    const act = Math.min(1, wl + ws + ww + wt);
    const disp = (th, layer) => {
      const ph = layer * 1.3;
      let d = 0;
      if (wl > 0.01) {
        // simétrica, como um espectro de áudio espelhado
        const tv = th + Math.PI / 2;
        let env = 0, low = 0;
        for (let k = 1; k <= 4; k++) { const a = nz(k * 1.7 + layer * 0.3, t * 1.8); env += a * Math.abs(Math.cos(k * tv + Math.sin(t * 0.6 + k) * 0.5)); low += a * Math.cos((k + 1) * tv + t * 0.4 * k + ph); }
        const osc = Math.sin(24 * tv + Math.sin(tv * 2) * 2 - t * 9 + ph) * 0.65 + Math.sin(38 * tv + t * 6 + ph) * 0.35;
        d += wl * lv * (0.18 * low + 0.62 * env * 0.5 * osc);
      }
      if (ws > 0.01) {
        let env = 0, low = 0;
        for (let k = 1; k <= 3; k++) { const a = nz(k * 0.9 + layer * 0.4, t * 2.4); env += a * Math.pow(Math.abs(Math.sin(k * th + t * (0.5 + 0.3 * k) * (k % 2 ? 1 : -1))), 1.5); low += a * Math.sin((k + 2) * th - t * 0.9 * k + ph); }
        const osc = Math.sin(20 * th + t * 12 + ph) * 0.65 + Math.sin(33 * th - t * 8 + ph) * 0.35;
        d += ws * (0.1 + en) * (0.22 * low + 0.7 * env * 0.6 * osc);
      }
      if (ww + wt > 0.01) {
        let dd = th - this.pen; dd = Math.atan2(Math.sin(dd), Math.cos(dd));
        const win = Math.exp(-(dd * dd) / 0.12);
        d += (ww + wt) * win * (0.35 + key) * Math.sin(dd * 26 - t * 16 + ph) * 0.42;
      }
      if (we > 0.01) d += we * 0.12 * Math.sin(th * 13 + t * 3) * Math.sin(t * 1.7 + th * 2);
      d += wi * 0.025 * Math.sin(th * 3 + t * 0.8 + ph);
      return d;
    };
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const baseA = 0.12 + 0.08 * Math.sin(t * 0.9) * wi + 0.75 * act + 0.18 * wth + 0.12 * wk - 0.08 * wo;
    const layers = px < 160 ? 1 : 3;
    for (let L = layers - 1; L >= 0; L--) {
      ctx.beginPath();
      for (let i = 0; i <= N; i++) {
        const th = (i / N) * Math.PI * 2;
        const r = r0 + L * px * 0.006 + disp(th, L) * A;
        const x = c + Math.cos(th) * r, y = c + Math.sin(th) * r;
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.closePath();
      const la = baseA * [1, 0.45, 0.22][L];
      if (wo > 0.5) ctx.setLineDash([2, 5]);
      if (L === 0 && act > 0.05) { ctx.strokeStyle = rgb(la * 0.16); ctx.lineWidth = Math.max(3, px * 0.016); ctx.stroke(); }
      ctx.strokeStyle = rgb(la); ctx.lineWidth = L === 0 ? Math.max(1, px * 0.0042) : Math.max(0.8, px * 0.0028); ctx.stroke();
      ctx.setLineDash([]);
    }
    // pensando: um cometa curto gira devagar no anel
    if (wth > 0.02) {
      const a0 = t * 1.6;
      for (let s = 0; s < 14; s++) {
        const u = s / 14;
        ctx.beginPath(); ctx.arc(c, c, r0, a0 - u * 0.9 - 0.07, a0 - u * 0.9);
        ctx.strokeStyle = rgb(wth * Math.pow(1 - u, 1.6) * 0.85); ctx.lineWidth = Math.max(1, px * 0.005); ctx.stroke();
      }
    }
    // trabalhando: dois pontos de luz em órbitas opostas, por fora do anel, cada um com um rastro curto (algo está sendo feito lá fora)
    if (wk > 0.02) {
      const ro = r0 * 1.115, TAU2 = Math.PI * 2;
      ctx.beginPath(); ctx.arc(c, c, ro, 0, TAU2); ctx.setLineDash([px * 0.006, px * 0.022]); ctx.strokeStyle = rgb(wk * 0.16); ctx.lineWidth = Math.max(0.6, px * 0.0022); ctx.stroke(); ctx.setLineDash([]);
      for (let s = 0; s < 2; s++) {
        const dir = s ? -1 : 1, a0 = dir * t * (s ? 0.8 : 1.2) + s * 2.3;
        for (let j = 0; j < 12; j++) {
          const u = j / 12, a1 = a0 - dir * u * 0.6, a2 = a1 - dir * 0.065;
          ctx.beginPath(); ctx.arc(c, c, ro, Math.min(a1, a2), Math.max(a1, a2));
          ctx.strokeStyle = rgb(wk * Math.pow(1 - u, 1.8) * 0.75); ctx.lineWidth = Math.max(1, px * 0.0045); ctx.stroke();
        }
        const hx = c + Math.cos(a0) * ro, hy = c + Math.sin(a0) * ro, hr = px * 0.022;
        const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr);
        g.addColorStop(0, rgb(wk * 0.95)); g.addColorStop(1, rgb(0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, hr, 0, TAU2); ctx.fill();
        ctx.fillStyle = 'rgba(255,246,222,' + (wk * 0.92).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(hx, hy, Math.max(1, px * 0.0055), 0, TAU2); ctx.fill();
      }
    }
    // escrevendo: tinta que fica atrás da caneta e some
    if (ww + wt > 0.02) {
      for (let s = 0; s < 20; s++) {
        const u = s / 20;
        ctx.beginPath(); ctx.arc(c, c, r0, this.pen - 0.35 - u * 1.6 - 0.09, this.pen - 0.35 - u * 1.6);
        ctx.strokeStyle = rgb((ww + wt) * Math.pow(1 - u, 2) * 0.5); ctx.lineWidth = Math.max(1, px * 0.0035); ctx.stroke();
      }
      const hx = c + Math.cos(this.pen) * r0, hy = c + Math.sin(this.pen) * r0, hr = px * (0.022 + 0.018 * key);
      const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr);
      g.addColorStop(0, rgb((ww + wt) * 0.9)); g.addColorStop(1, rgb(0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  drawFallback() {
    const cv = this.cv, px = this.props.px || 400;
    if (!cv || this.fbDone) return;
    this.fbDone = true;
    const c2 = this.ov && this.ov.getContext('2d');
    if (!c2) return;
    this.ov.width = px; this.ov.height = px;
    const g = c2.createRadialGradient(px * 0.42, px * 0.4, 2, px / 2, px / 2, px * 0.4);
    g.addColorStop(0, '#f6d48c'); g.addColorStop(0.4, '#8a5f22'); g.addColorStop(1, 'rgba(7,8,10,0)');
    c2.fillStyle = g; c2.beginPath(); c2.arc(px / 2, px / 2, px * 0.4, 0, TAU); c2.fill();
  }

  renderVals() {
    const p = this.props;
    const names = { idle: 'aguardando', listening: 'ouvindo', transcribing: 'transcrevendo', thinking: 'pensando', speaking: 'falando', writing: 'escrevendo', working: 'trabalhando', error: 'algo falhou', offline: 'sem conexão' };
    return { setCanvas: this.setCanvas, setOver: this.setOver, px: p.px || 400, ariaLabel: 'Bolinha do Guardião, ' + (names[p.state] || 'aguardando') };
  }
}
</script>
