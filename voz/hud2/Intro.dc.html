<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Abertura</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#07080a}
</style>
</helmet>
<canvas ref="{{setCanvas}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: {{w}}px; height: {{h}}px; display: block; pointer-events: none"></canvas>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":null},"h":{"editor":null},"ox":{"editor":null},"oy":{"editor":null},"r":{"editor":null},"t0":{"editor":null},"person":{"editor":null},"dateLong":{"editor":null},"clock":{"editor":null},"sys":{"editor":null},"arcs":{"editor":null},"nowF":{"editor":null},"dayLine":{"editor":null},"logs":{"editor":null},"skip":{"editor":null},"$preview":{"width":1440,"height":900}}'>
const TAU = Math.PI * 2;
const GOLD = [227, 185, 100], GOLD2 = [178, 132, 49], BRONZE = [111, 83, 34], IVORY = [243, 236, 220], DIM = [138, 130, 111], BRASA = [210, 96, 58], HOT = [255, 240, 205];
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + Math.max(0, Math.min(1, a)).toFixed(3) + ')';
const cl = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const eo = (x) => { x = cl(x); return 1 - Math.pow(1 - x, 3); };
const eio = (x) => { x = cl(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const ang = (f) => (108 + 324 * f) * Math.PI / 180;
const MONO = '"JetBrains Mono", ui-monospace, monospace', SERIF = '"Cormorant Garamond", Georgia, serif';
// linha do tempo da abertura, em segundos
const T = { power: 0.1, rings: 0.6, sys: 2.3, day: 4.7, online: 6.0, collapse: 6.15, flash: 6.62, end: 7.5 };
const PHASES = [[0.9, 'INICIALIZANDO NÚCLEO'], [2.2, 'VERIFICANDO SISTEMAS'], [4.6, 'CARREGANDO O SEU DIA'], [6.0, 'TODOS OS SISTEMAS ONLINE']];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {};
    this.cv = null; this.raf = 0; this.t0 = 0;
    this.setCanvas = (el) => { this.cv = el; };
    this.loop = () => { this.raf = 0; if (this.frame()) this.raf = requestAnimationFrame(this.loop); };
  }
  componentDidMount() { this.kick(); }
  componentDidUpdate() { this.kick(); }
  componentWillUnmount() { cancelAnimationFrame(this.raf); this.raf = 0; }
  kick() {
    const p = this.props;
    if (p.skip || !p.t0) { cancelAnimationFrame(this.raf); this.raf = 0; this.clear(); this.t0 = 0; return; }
    if (this.t0 !== p.t0) { this.t0 = p.t0; this.dots = null; }
    if (!this.raf) this.raf = requestAnimationFrame(this.loop);
  }
  clear() { if (this.cv) { const c = this.cv.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, this.cv.width, this.cv.height); } }

  frame() {
    const p = this.props, cv = this.cv;
    if (!cv || !this.t0) return false;
    const e = (Date.now() - this.t0) / 1000;
    const W = p.w || 1440, H = p.h || 900;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (e > T.end + 0.3) return false;
    this.draw(ctx, e, W, H);
    return true;
  }

  draw(ctx, e, W, H) {
    const p = this.props, mobile = W < 600;
    const ox = typeof p.ox === 'number' ? p.ox : W / 2, oy = typeof p.oy === 'number' ? p.oy : H * 0.38;
    const R = p.r || 90;
    let k = 1; const r5raw = R * 3.0;
    const lim = Math.min(W / 2 - 14, oy - 70, H - oy - 60);
    if (r5raw > lim) k = Math.max(0.55, lim / r5raw);
    const r1 = R * 1.22, r2 = R * 1.5 * k + R * (1 - k) * 0.4, r3 = R * 1.85 * k + R * (1 - k) * 0.6, r4 = R * 2.4 * k + R * (1 - k) * 0.7, r5 = R * 3.0 * k + R * (1 - k) * 0.8;
    const fs = mobile ? 0.86 : 1;

    // fundo: preto até o flash, depois some e revela o app
    const bgA = e < T.flash ? 1 : 1 - eo((e - T.flash) / 0.75);
    ctx.fillStyle = rgba([7, 8, 10], bgA); ctx.fillRect(0, 0, W, H);

    const col = eo((e - T.collapse) / (T.flash - T.collapse));
    const scaleR = 1 - 0.78 * col * col;
    const hudA = (e < T.flash ? 1 : 0) * (1 - 0.4 * col);
    const spin = e + col * col * 5;
    const sysFade = 1 - eo((e - 6.05) / 0.35);

    // grade de pontos, bem leve, em volta do HUD
    if (e > 0.9 && e < T.flash && bgA > 0) {
      const gA = 0.07 * eo((e - 0.9) / 1.2) * sysFade;
      const step = mobile ? 22 : 28, maxD = r5 * 1.7;
      ctx.fillStyle = rgba(GOLD2, 1);
      for (let x = (ox % step); x < W; x += step) for (let y = (oy % step); y < H; y += step) {
        const d = Math.hypot(x - ox, y - oy); if (d > maxD || d < r1) continue;
        ctx.globalAlpha = gA * (1 - d / maxD); ctx.fillRect(x - 0.6, y - 0.6, 1.2, 1.2);
      }
      ctx.globalAlpha = 1;
    }

    // 1 · ligando: faísca e linha de varredura
    if (e > T.power && e < 1.4) {
      const a = eo((e - T.power) / 0.35) * (1 - eo((e - 0.75) / 0.6));
      const sr = 3 + 26 * eo((e - T.power) / 0.4);
      const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, sr * 2.2);
      g.addColorStop(0, rgba(HOT, a)); g.addColorStop(0.3, rgba(GOLD, a * 0.6)); g.addColorStop(1, rgba(GOLD, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, sr * 2.2, 0, TAU); ctx.fill();
      const lw = W * eo((e - 0.3) / 0.45), la = 1 - eo((e - 0.55) / 0.6);
      if (lw > 1 && la > 0) {
        const lg = ctx.createLinearGradient(ox - lw / 2, 0, ox + lw / 2, 0);
        lg.addColorStop(0, rgba(GOLD, 0)); lg.addColorStop(0.5, rgba(HOT, la)); lg.addColorStop(1, rgba(GOLD, 0));
        ctx.fillStyle = lg; ctx.fillRect(ox - lw / 2, oy - 0.75, lw, 1.5);
        ctx.fillStyle = rgba(GOLD, la * 0.08); ctx.fillRect(ox - lw / 2, oy - 14, lw, 28);
      }
    }

    // núcleo carregando
    if (e > 0.4 && e < T.flash + 0.3) {
      const ch = cl(e / 6.2), pul = 0.5 + 0.5 * Math.sin(e * 6);
      const cr = R * (0.16 + 0.26 * ch + 0.06 * pul * ch + 0.5 * col);
      const a = eo((e - 0.4) / 0.6) * (e > T.flash ? 1 - eo((e - T.flash) / 0.3) : 1);
      const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, cr * 2.6);
      g.addColorStop(0, rgba(HOT, a)); g.addColorStop(0.18, rgba(GOLD, a * 0.85)); g.addColorStop(0.5, rgba(GOLD2, a * 0.25)); g.addColorStop(1, rgba(GOLD2, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, cr * 2.6, 0, TAU); ctx.fill();
    }

    // 2 · anéis do HUD
    if (e > T.rings && hudA > 0.01) {
      ctx.save(); ctx.translate(ox, oy); ctx.scale(scaleR, scaleR); ctx.globalAlpha = hudA; ctx.lineCap = 'round';
      const onl = e > T.online && e < T.collapse + 0.1 ? 1 : 0;
      // anel 1
      const p1 = eo((e - T.rings) / 0.6);
      ctx.beginPath(); ctx.arc(0, 0, r1, -Math.PI / 2, -Math.PI / 2 + TAU * p1);
      ctx.strokeStyle = rgba(GOLD, 0.12 + 0.2 * onl); ctx.lineWidth = 6; ctx.stroke();
      ctx.strokeStyle = rgba(GOLD, 0.8); ctx.lineWidth = 1.4; ctx.stroke();
      if (p1 < 1) { const a1 = -Math.PI / 2 + TAU * p1; ctx.fillStyle = rgba(HOT, 1); ctx.beginPath(); ctx.arc(Math.cos(a1) * r1, Math.sin(a1) * r1, 2.6, 0, TAU); ctx.fill(); }
      // anel 2: marcas
      const n2 = 120, vis = Math.floor(n2 * eo((e - 0.8) / 0.7)), rot2 = spin * 0.12;
      if (vis > 0) {
        ctx.beginPath();
        for (let i = 0; i < vis; i++) { const a = rot2 + (i / n2) * TAU, L = i % 10 === 0 ? 9 : 4; ctx.moveTo(Math.cos(a) * r2, Math.sin(a) * r2); ctx.lineTo(Math.cos(a) * (r2 + L), Math.sin(a) * (r2 + L)); }
        ctx.strokeStyle = rgba(GOLD, 0.5); ctx.lineWidth = 1; ctx.stroke();
      }
      // anel 3: segmentos que giram ao contrário
      const p3 = eo((e - 1.0) / 0.6);
      if (p3 > 0) {
        for (let j = 0; j < 4; j++) {
          const a0 = -spin * 0.22 + j * Math.PI / 2 + 0.14;
          ctx.beginPath(); ctx.arc(0, 0, r3, a0, a0 + (Math.PI / 2 - 0.28) * p3);
          ctx.strokeStyle = rgba(GOLD, 0.55); ctx.lineWidth = 3.2; ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0, 0, r3 - 8, 0, TAU); ctx.strokeStyle = rgba(GOLD2, 0.2 * p3); ctx.lineWidth = 1; ctx.stroke();
      }
      // anel 4: graus
      const p4 = eo((e - 1.3) / 0.5);
      if (p4 > 0) {
        ctx.beginPath(); ctx.arc(0, 0, r4, 0, TAU); ctx.strokeStyle = rgba(GOLD2, 0.24 * p4); ctx.lineWidth = 1; ctx.stroke();
        if (!mobile) {
          ctx.font = '500 ' + (9 * fs) + 'px ' + MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          const rot4 = spin * 0.04;
          for (let i = 0; i < 12; i++) {
            if (e < 1.3 + i * 0.05) break;
            const a = rot4 + i * TAU / 12; const lab = String(i * 30).padStart(3, '0');
            ctx.fillStyle = rgba(GOLD, 0.5); ctx.fillText(lab, Math.cos(a) * (r4 + 14), Math.sin(a) * (r4 + 14));
          }
        }
      }
      // anel 5: arcos pontilhados e cantoneiras
      const p5 = eo((e - 1.6) / 0.5);
      if (p5 > 0) {
        ctx.setLineDash([1.5, 6]);
        [[Math.PI - 0.62, Math.PI + 0.62], [-0.62, 0.62]].forEach((s) => { ctx.beginPath(); ctx.arc(0, 0, r5, s[0], s[0] + (s[1] - s[0]) * p5); ctx.strokeStyle = rgba(GOLD, 0.45); ctx.lineWidth = 1.2; ctx.stroke(); });
        ctx.setLineDash([]);
        for (let q = 0; q < 4; q++) {
          const a = Math.PI / 4 + q * Math.PI / 2, cx = Math.cos(a) * r5, cy = Math.sin(a) * r5, sx = Math.sign(cx), sy = Math.sign(cy), L = 10 * p5;
          ctx.beginPath(); ctx.moveTo(cx - sx * L, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy - sy * L);
          ctx.strokeStyle = rgba(GOLD, 0.6); ctx.lineWidth = 1.2; ctx.stroke();
        }
      }
      // varredura de radar
      if (e > 1.0 && e < T.collapse) {
        const a = spin * 1.4, sa = eo((e - 1.0) / 0.5) * (1 - eo((e - 5.9) / 0.3));
        for (let s = 0; s < 14; s++) {
          ctx.beginPath(); ctx.moveTo(Math.cos(a - s * 0.045) * r1, Math.sin(a - s * 0.045) * r1);
          ctx.arc(0, 0, r4, a - s * 0.045, a - (s + 1) * 0.045, true); ctx.closePath();
          ctx.fillStyle = rgba(GOLD, 0.075 * (1 - s / 14) * sa); ctx.fill();
        }
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.lineTo(Math.cos(a) * r4, Math.sin(a) * r4);
        ctx.strokeStyle = rgba(HOT, 0.35 * sa); ctx.lineWidth = 1; ctx.stroke();
      }
      // 4 · o dia: tarefas acendendo no anel
      if (e > T.day) {
        const rd = (r1 + r2) / 2 - 2;
        const arcs = p.arcs || [];
        const kc = { done: [BRONZE, 0.95], now: [GOLD, 1], next: [GOLD2, 0.7], fixed: [IVORY, 0.4], miss: [BRASA, 0.85] };
        ctx.beginPath(); ctx.arc(0, 0, rd, ang(0), ang(1)); ctx.strokeStyle = rgba(GOLD2, 0.14 * eo((e - T.day) / 0.3)); ctx.lineWidth = 1; ctx.stroke();
        arcs.forEach((a, i) => {
          const pa = eo((e - (T.day + 0.08 + i * 0.12)) / 0.22); if (pa <= 0) return;
          const c = kc[a.k] || kc.next, f0 = ang(a.a) + 0.01, f1 = ang(a.b) - 0.01;
          ctx.beginPath(); ctx.arc(0, 0, rd, f0, f0 + (f1 - f0) * pa);
          if (a.k === 'now') { ctx.strokeStyle = rgba(GOLD, 0.25); ctx.lineWidth = 9; ctx.stroke(); }
          ctx.strokeStyle = rgba(c[0], c[1]); ctx.lineWidth = a.k === 'now' ? 4.5 : 3.5; ctx.stroke();
        });
        const pn = eo((e - 5.75) / 0.3);
        if (pn > 0) {
          const an = ang(typeof p.nowF === 'number' ? p.nowF : 0.25);
          ctx.beginPath(); ctx.moveTo(Math.cos(an) * (rd - 14), Math.sin(an) * (rd - 14)); ctx.lineTo(Math.cos(an) * (rd + 10), Math.sin(an) * (rd + 10));
          ctx.strokeStyle = rgba(IVORY, 0.9 * pn); ctx.lineWidth = 1.4; ctx.stroke();
          ctx.fillStyle = rgba(IVORY, pn); ctx.beginPath(); ctx.arc(Math.cos(an) * rd, Math.sin(an) * rd, 3.2, 0, TAU); ctx.fill();
        }
      }
      ctx.restore();
    }

    // 3 · sistemas: nós ligados ao núcleo
    const sys = p.sys || [];
    if (e > T.sys - 0.05 && sysFade > 0) {
      ctx.save(); ctx.globalAlpha = sysFade;
      const left = Math.ceil(sys.length / 2 + 0.5);
      sys.forEach((sItem, i) => {
        const ti = T.sys + i * 0.3; if (e < ti) return;
        let nx, ny, side;
        if (mobile) { const col2 = i % 2, row = Math.floor(i / 2); nx = col2 ? W / 2 + 8 : 20; ny = oy + r5 + 34 + row * 24; side = 1; }
        else if (i < left) { side = -1; nx = ox - r5 - 34; ny = oy - (left - 1) * 26 + i * 52; }
        else { side = 1; nx = ox + r5 + 34; const j = i - left, n = sys.length - left; ny = oy - (n - 1) * 26 + j * 52; }
        const pc = eo((e - ti) / 0.25);
        let ax = 0, ay = 0;
        if (!mobile) {
          const th = Math.atan2(ny - oy, nx - ox);
          const sx = ox + Math.cos(th) * r3 * scaleR, sy = oy + Math.sin(th) * r3 * scaleR, ex = ox + side * (r5 + 12), exy = ny, enx = nx - side * 8;
          const L1 = Math.hypot(ex - sx, exy - sy), L2 = Math.abs(enx - ex), Lt = (L1 + L2) * pc;
          ctx.beginPath(); ctx.moveTo(sx, sy);
          if (Lt <= L1) ctx.lineTo(sx + (ex - sx) * Lt / L1, sy + (exy - sy) * Lt / L1);
          else { ctx.lineTo(ex, exy); ctx.lineTo(ex + (enx - ex) * (Lt - L1) / L2, exy); }
          ctx.strokeStyle = rgba(GOLD, 0.38); ctx.lineWidth = 1; ctx.stroke();
          // pacotes de dados indo para o núcleo
          if (e > ti + 0.45 && e < 6.1) {
            const per = 0.62, u = (((e - ti - 0.45) + i * 0.11) % per) / per, d = (L1 + L2) * (1 - u);
            let px, py;
            if (d <= L1) { px = sx + (ex - sx) * d / L1; py = sy + (exy - sy) * d / L1; } else { px = ex + (enx - ex) * (d - L1) / L2; py = exy; }
            const g = ctx.createRadialGradient(px, py, 0, px, py, 6); g.addColorStop(0, rgba(HOT, 0.95)); g.addColorStop(1, rgba(GOLD, 0));
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, 6, 0, TAU); ctx.fill();
          }
          ax = nx; ay = ny;
        } else { ax = nx; ay = ny; }
        // rótulo digitado e valor
        const lab = sItem.k.toUpperCase(), nch = Math.floor((e - ti - 0.1) * 45);
        ctx.font = '500 ' + (11 * fs) + 'px ' + MONO; ctx.textBaseline = 'middle';
        const txt = lab.slice(0, Math.max(0, nch));
        const okOn = e > ti + 0.42;
        if (side < 0) {
          ctx.textAlign = 'right'; ctx.fillStyle = rgba(DIM, 1); ctx.fillText(spaced(txt), ax, ay - 8);
          if (okOn) { ctx.fillStyle = rgba(GOLD, eo((e - ti - 0.42) / 0.2)); ctx.fillText(spaced(String(sItem.v).toUpperCase()), ax, ay + 9); }
          this.dot(ctx, ax + 16, ay, e - ti - 0.42);
        } else {
          ctx.textAlign = 'left'; const tx = mobile ? ax + 12 : ax;
          ctx.fillStyle = rgba(DIM, 1); ctx.fillText(spaced(txt), tx, mobile ? ay : ay - 8);
          if (okOn) { ctx.fillStyle = rgba(GOLD, eo((e - ti - 0.42) / 0.2)); if (mobile) { ctx.textAlign = 'right'; ctx.fillText(spaced(String(sItem.v).toUpperCase()), ax + (W / 2 - 28), ay); } else ctx.fillText(spaced(String(sItem.v).toUpperCase()), tx, ay + 9); }
          this.dot(ctx, mobile ? ax + 3 : ax - 16, ay, e - ti - 0.42);
        }
      });
      ctx.restore();
    }

    // textos do sistema: canto superior esquerdo, relógio e barra de carga
    const txA = (1 - eo((e - 6.25) / 0.3)) * eo((e - 0.85) / 0.3);
    if (txA > 0.01) {
      ctx.save(); ctx.globalAlpha = txA; ctx.textBaseline = 'alphabetic';
      const lx = mobile ? 20 : 56, ly = mobile ? 88 : 116;
      ctx.font = '500 ' + (10.5 * fs) + 'px ' + MONO; ctx.textAlign = 'left';
      ctx.fillStyle = rgba(GOLD, 0.9); ctx.fillText(spaced('GUARDIÃO OS 3.0 · NÚCLEO 01'), lx, ly);
      let ph = PHASES[0]; PHASES.forEach((q) => { if (e >= q[0]) ph = q; });
      const nch = Math.floor((e - ph[0]) * 34), line = ph[1].slice(0, Math.max(0, nch));
      ctx.font = '500 ' + (13 * fs) + 'px ' + MONO; ctx.fillStyle = rgba(IVORY, 0.95);
      ctx.fillText(spaced(line), lx, ly + 24);
      const cw = ctx.measureText(spaced(line)).width;
      if (Math.floor(e * 2.4) % 2 === 0) { ctx.fillStyle = rgba(GOLD, 0.9); ctx.fillRect(lx + cw + 4, ly + 13, 7, 13); }
      // log de inicialização
      if (!mobile) {
        const logs = p.logs || [];
        ctx.font = '400 ' + 11 + 'px ' + MONO;
        const shown = logs.filter((l, i) => e > 1.1 + i * 0.55).slice(-6);
        shown.forEach((l, i) => { const age = shown.length - 1 - i; ctx.fillStyle = rgba(DIM, 0.75 - age * 0.11); ctx.fillText('› ' + l, lx, ly + 58 + i * 19); });
      }
      // relógio
      ctx.textAlign = 'right'; ctx.font = '500 ' + (10.5 * fs) + 'px ' + MONO; ctx.fillStyle = rgba(DIM, 0.9);
      if (!mobile) { ctx.fillText(spaced(p.clock || ''), W - 56, ly); ctx.fillStyle = rgba(GOLD2, 0.8); ctx.fillText(spaced('SESSÃO 0247 · CRIPTOGRAFADA'), W - 56, ly + 20); }
      // barra de carga
      const pr = e < 2.2 ? 0.14 * eo((e - 0.6) / 1.6) : e < 4.6 ? 0.14 + 0.44 * eio((e - 2.2) / 2.4) : e < 6 ? 0.58 + 0.42 * eio((e - 4.6) / 1.4) : 1;
      const bw = mobile ? W - 40 : 340, bx = mobile ? 20 : W / 2 - bw / 2, by = H - (mobile ? 64 : 78);
      ctx.fillStyle = rgba(GOLD2, 0.18); ctx.fillRect(bx, by, bw, 1);
      ctx.fillStyle = rgba(GOLD, 0.95); ctx.fillRect(bx, by - 0.5, bw * pr, 2);
      const hg = ctx.createRadialGradient(bx + bw * pr, by, 0, bx + bw * pr, by, 10); hg.addColorStop(0, rgba(HOT, 0.9)); hg.addColorStop(1, rgba(GOLD, 0));
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(bx + bw * pr, by, 10, 0, TAU); ctx.fill();
      ctx.font = '500 ' + (10 * fs) + 'px ' + MONO; ctx.fillStyle = rgba(DIM, 1); ctx.textAlign = 'left';
      ctx.fillText(spaced(pr >= 1 ? 'PRONTO' : 'CARREGANDO'), bx, by - 12);
      ctx.textAlign = 'right'; ctx.fillStyle = rgba(GOLD, 1); ctx.fillText(String(Math.round(pr * 100)).padStart(3, '0') + '%', bx + bw, by - 12);
      ctx.restore();
    }

    // o dia em texto, sob o HUD
    if (e > T.day && e < 6.5) {
      const a = eo((e - T.day) / 0.3) * (1 - eo((e - 6.1) / 0.3));
      const ty = mobile ? H - 150 : Math.min(H - 130, oy + r5 + 46);
      ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = '500 ' + (10.5 * fs) + 'px ' + MONO; ctx.fillStyle = rgba(GOLD, 0.95);
      ctx.fillText(spaced(('Hoje · ' + (p.dateLong || '')).toUpperCase()), W / 2, ty);
      const dl = p.dayLine || '', nch = Math.floor((e - T.day - 0.25) * 42);
      ctx.font = 'italic 500 ' + (mobile ? 19 : 24) + 'px ' + SERIF; ctx.fillStyle = rgba(IVORY, 1);
      const shown = dl.slice(0, Math.max(0, nch));
      if (!mobile) ctx.fillText(shown, W / 2, ty + 34);
      else {
        const words = shown.split(' '), lines = ['']; const maxW = W - 40;
        words.forEach((wd) => { const tryL = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + wd : wd; if (ctx.measureText(tryL).width > maxW && lines[lines.length - 1]) lines.push(wd); else lines[lines.length - 1] = tryL; });
        lines.slice(0, 2).forEach((l, i) => ctx.fillText(l, W / 2, ty + 28 + i * 24));
      }
      ctx.restore();
    }

    // 5 · flash e onda de choque: a bolinha nasce aqui
    if (e > T.flash - 0.02) {
      const f = (e - T.flash) / 0.55;
      if (f < 1) {
        const dr = R * (1.3 + 0.9 * eo(f)), a = Math.pow(1 - cl(f), 2);
        const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, dr);
        g.addColorStop(0, rgba([255, 252, 240], a)); g.addColorStop(0.35, rgba(HOT, a * 0.8)); g.addColorStop(1, rgba(GOLD, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, dr, 0, TAU); ctx.fill();
        ctx.fillStyle = rgba(HOT, 0.1 * (1 - cl(f))); ctx.fillRect(0, 0, W, H);
      }
      const maxD = Math.hypot(Math.max(ox, W - ox), Math.max(oy, H - oy));
      [[0, 1.1, 0.75, 2.4], [0.12, 1.5, 0.35, 1.2]].forEach((w) => {
        const f2 = (e - T.flash - w[0]) / w[1]; if (f2 <= 0 || f2 >= 1) return;
        const rr = R + (maxD - R) * eo(f2);
        ctx.beginPath(); ctx.arc(ox, oy, rr, 0, TAU); ctx.strokeStyle = rgba(GOLD, w[2] * (1 - f2)); ctx.lineWidth = w[3] * (1 - f2) + 0.5; ctx.stroke();
      });
    }
  }

  dot(ctx, x, y, age) {
    const on = age > 0, a = on ? 1 : 0.35;
    if (on && age < 0.6) { const rr = 4 + 14 * eo(age / 0.6); ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.strokeStyle = rgba(GOLD, 0.6 * (1 - age / 0.6)); ctx.lineWidth = 1; ctx.stroke(); }
    if (on) { const g = ctx.createRadialGradient(x, y, 0, x, y, 9); g.addColorStop(0, rgba(GOLD, 0.6)); g.addColorStop(1, rgba(GOLD, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU); ctx.fill(); }
    ctx.fillStyle = rgba(on ? GOLD : DIM, a); ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fill();
  }

  renderVals() { const p = this.props; return { setCanvas: this.setCanvas, w: p.w || 1440, h: p.h || 900 }; }
}
function spaced(s) { return String(s).split('').join(String.fromCharCode(8202)); }
</script>
